<!doctype html>
<html><head><meta charset="utf-8"><title>Back office</title></head>
<body><h1>Back office</h1><p id="error" role="alert"></p><div id="app"></div>
<script>
async function api(m, p, b) { const r = await fetch(p, {method: m, headers: {"Content-Type": "application/json"}, body: b && JSON.stringify(b)});
  const t = await r.text(); const d = t ? JSON.parse(t) : null; document.getElementById("error").textContent = r.ok ? "" : d.error.message; return d; }
api("GET", "/api/cleaners").then(c => document.getElementById("app").textContent = (c || []).length + " cleaners");
</script></body></html>
